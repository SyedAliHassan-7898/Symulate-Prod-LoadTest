# monitoring/docker-compose.yml
#
# Live Grafana monitoring stack for k6 runs — InfluxDB (time-series store
# k6 writes to natively, no extension/build needed) + Grafana (pre-wired
# with the InfluxDB datasource and a k6 dashboard).
#
# Usage (from this monitoring/ folder):
#   docker compose up -d
#   -> Grafana:  http://localhost:3001  (admin / admin, change on first login)
#   -> InfluxDB: http://localhost:8087  (bucket/db: k6, no auth in this dev setup)
#      (host port 8087, not the default 8086, to avoid clashing with any
#      InfluxDB/other stack you may already have running locally — the
#      container itself still listens on 8086, Grafana talks to it over
#      the internal docker network so this doesn't affect Grafana)
#
# Then, from the project root, run any load script with the *:grafana
# variant, e.g.:
#   npm run load:grafana
#   npm run load:grafana:no-anum
#
# Those scripts point k6's built-in InfluxDB output at this stack
# (--out influxdb=http://localhost:8087/k6), so you can watch requests/sec,
# p95/p99 latency, error rate, and VU count update live in Grafana while
# the test is still running — not just after it finishes.
#
# Stop the stack with: docker compose down
# Wipe stored metrics too: docker compose down -v
#
# Port already in use even at 8087? Change the LEFT side of the port
# mapping below (e.g. '8088:8086') and update the --out influxdb=... URL
# in package.json's *:grafana scripts to match — the right side (8086)
# must stay as-is, that's InfluxDB's port inside the container.

services:
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    ports:
      - '8087:8086'
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.4.2
    container_name: k6-grafana
    ports:
      - '3001:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_INSTALL_PLUGINS=grafana-influxdb-flux-datasource
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data:
